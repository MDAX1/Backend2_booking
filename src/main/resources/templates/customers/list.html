<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Kunder')}"><title>Pensionat</title></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="bk-page-bar">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h2><i class="bi bi-people me-2"></i>Kunder</h2>
            <div class="bk-breadcrumb">
                <a th:href="@{/}">Hem</a>
                <span class="sep">/</span>
                <span>Kunder</span>
            </div>
        </div>
        <a class="btn-nav-solid" style="padding:8px 18px" th:href="@{/customers/new}">
            <i class="bi bi-person-plus me-1"></i>Ny kund
        </a>
    </div>
</div>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <!-- Empty state -->
    <div class="bk-card p-5 text-center" th:if="${customers.isEmpty()}">
        <div style="font-size:3rem; margin-bottom:12px">👤</div>
        <h5 class="fw-bold mb-2">Inga kunder registrerade ännu</h5>
        <p class="text-muted mb-3">Lägg till din första kund för att kunna skapa bokningar.</p>
        <a class="btn btn-bk" th:href="@{/customers/new}">
            <i class="bi bi-person-plus me-1"></i>Lägg till kund
        </a>
    </div>

    <!-- Table -->
    <div class="bk-card" th:unless="${customers.isEmpty()}">
        <div class="bk-card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-people me-2" style="color:var(--bk-blue)"></i>Alla kunder</span>
            <span class="text-muted" style="font-size:12px; font-weight:400"
                  th:text="${customers.size() + ' kunder'}"></span>
        </div>
        <div style="overflow-x:auto">
            <table class="bk-table">
                <thead>
                <tr>
                    <th>Namn</th>
                    <th>E-post</th>
                    <th>Telefon</th>
                    <th>Adress</th>
                    <th class="text-center">Bokningar</th>
                    <th class="text-end">Åtgärder</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${customers}">
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <div style="width:32px; height:32px; border-radius:50%; background:var(--bk-navy); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; flex-shrink:0"
                                 th:text="${#strings.substring(c.fullName, 0, 1)}">A
                            </div>
                            <span class="fw-bold" th:text="${c.fullName}"></span>
                        </div>
                    </td>
                    <td>
                        <a th:href="${'mailto:' + c.email}" th:if="${c.email != null and !c.email.isEmpty()}"
                           th:text="${c.email}" style="color:var(--bk-blue)"></a>
                        <span class="text-muted" th:unless="${c.email != null and !c.email.isEmpty()}">–</span>
                    </td>
                    <td th:text="${c.phone != null and !c.phone.isEmpty() ? c.phone : '–'}"></td>
                    <td>
                        <span class="text-muted" style="font-size:12px"
                              th:text="${c.address != null and !c.address.isEmpty() ? c.address : '–'}"></span>
                    </td>
                    <td class="text-center">
                        <span style="display:inline-block; min-width:28px; padding:2px 8px; border-radius:12px; font-size:12px; font-weight:700"
                              th:style="${c.bookingCount == 0} ? 'background:#f0f0f0;color:#666' : 'background:#cce5ff;color:#003f8c'"
                              th:text="${c.bookingCount}"></span>
                    </td>
                    <td class="text-end">
                        <div class="d-flex gap-1 justify-content-end">
                            <a class="btn btn-bk btn-sm"
                               th:href="@{/customers/{id}/edit(id=${c.id})}">
                                <i class="bi bi-pencil me-1"></i>Redigera
                            </a>
                            <form class="d-inline" method="post"
                                  onsubmit="return confirm('Ta bort kunden?');"
                                  th:action="@{/customers/{id}/delete(id=${c.id})}">
                                <button class="btn btn-outline-danger btn-sm"
                                        th:disabled="${c.bookingCount > 0}"
                                        th:title="${c.bookingCount > 0} ? 'Kunden har aktiva bokningar'"
                                        type="submit">
                                    <i class="bi bi-trash me-1"></i>Ta bort
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
