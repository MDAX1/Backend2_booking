<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rum')}"><title>Pensionat</title></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="bk-page-bar">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h2><i class="bi bi-door-open me-2"></i>Rum</h2>
            <div class="bk-breadcrumb">
                <a th:href="@{/}">Hem</a>
                <span class="sep">/</span>
                <span>Rum</span>
            </div>
        </div>
        <a class="btn-nav-solid" style="padding:8px 18px" th:href="@{/rooms/new}">
            <i class="bi bi-plus-lg me-1"></i>Nytt rum
        </a>
    </div>
</div>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <!-- Empty state -->
    <div class="bk-card p-5 text-center" th:if="${rooms.isEmpty()}">
        <div style="font-size:3rem; margin-bottom:12px">🚪</div>
        <h5 class="fw-bold mb-2">Inga rum registrerade</h5>
        <p class="text-muted mb-3">Lägg till rum för att kunna ta emot bokningar.</p>
        <a class="btn btn-bk" th:href="@{/rooms/new}">
            <i class="bi bi-plus-lg me-1"></i>Lägg till rum
        </a>
    </div>

    <!-- Table -->
    <div class="bk-card" th:unless="${rooms.isEmpty()}">
        <div class="bk-card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-door-open me-2" style="color:var(--bk-blue)"></i>Alla rum</span>
            <span class="text-muted" style="font-size:12px; font-weight:400"
                  th:text="${rooms.size() + ' rum'}"></span>
        </div>
        <div style="overflow-x:auto">
            <table class="bk-table">
                <thead>
                <tr>
                    <th>Rumsnr.</th>
                    <th>Typ</th>
                    <th>Beskrivning</th>
                    <th class="text-center">Extrasängar</th>
                    <th class="text-center">Kapacitet</th>
                    <th class="text-end">Pris / natt</th>
                    <th class="text-end">Åtgärder</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${rooms}">
                    <td>
                        <span class="fw-bold" style="font-size:15px" th:text="${r.roomNumber}"></span>
                    </td>
                    <td>
                        <span class="badge-type-single" th:if="${r.type.name() == 'SINGLE'}"
                              th:text="${r.type.displayName}"></span>
                        <span class="badge-type-double" th:if="${r.type.name() == 'DOUBLE'}"
                              th:text="${r.type.displayName}"></span>
                    </td>
                    <td>
                        <span class="text-muted" style="font-size:12px" th:text="${r.typeDescription}"></span>
                    </td>
                    <td class="text-center">
                        <span th:if="${r.type.name() == 'SINGLE'}" class="text-muted">–</span>
                        <span th:unless="${r.type.name() == 'SINGLE'}">
                            <span class="fw-bold" th:text="${r.extraBeds}"></span>
                            <span class="text-muted" style="font-size:11px"> st</span>
                        </span>
                    </td>
                    <td class="text-center">
                        <i class="bi bi-people" style="color:var(--bk-text-light); font-size:12px"></i>
                        <span class="fw-bold" th:text="${r.capacity}"></span>
                        <span class="text-muted" style="font-size:11px"> pers.</span>
                    </td>
                    <td class="text-end">
                        <span class="fw-bold" style="color:var(--bk-navy); font-size:15px"
                              th:text="${#numbers.formatDecimal(r.pricePerNight,1,'COMMA',0,'POINT') + ' kr'}"></span>
                    </td>
                    <td class="text-end">
                        <div class="d-flex gap-1 justify-content-end">
                            <a class="btn btn-bk btn-sm" th:href="@{/rooms/{id}/edit(id=${r.id})}">
                                <i class="bi bi-pencil me-1"></i>Redigera
                            </a>
                            <form class="d-inline" method="post"
                                  onsubmit="return confirm('Ta bort rummet?');"
                                  th:action="@{/rooms/{id}/delete(id=${r.id})}">
                                <button class="btn btn-outline-danger btn-sm" type="submit">
                                    <i class="bi bi-trash me-1"></i>Ta bort
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
