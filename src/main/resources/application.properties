spring.application.name=booking-service
server.port=${PORT:8081}
server.forward-headers-strategy=native

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:bookingdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8080}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

management.endpoint.health.probes.enabled=true

# Must match the customer service that issues the tokens.
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=pensionat-customer-service
app.jwt.audience=pensionat
